<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Pencarian Dalil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Pencarian Dalil</h1>

    <!-- ===================== -->
    <!-- SEARCH (TETAP) -->
    <!-- ===================== -->
    <div class="search-container">
      <input
        type="text"
        id="keyword"
        placeholder="Ketik kata atau konteks dalil…"
        oninput="handleInput()"
      />
      <select id="searchTahunSelect" onchange="handleInput()" style="margin-top: 10px; padding: 10px; width: 100%; border-radius: 6px; border: 1px solid #ccc;">
        <option value="">-- Semua Tahun --</option>
      </select>
    </div>

    <div id="hasil"></div>

    <hr />

    <!-- ===================== -->
    <!-- MODE GABUT -->
    <!-- ===================== -->
    <h2>📚 BACA BROSUR</h2>

    <div class="brosur-filter">
      <select id="tahunSelect" onchange="renderBrosurByTahun()">
        <option value="">-- Pilih Tahun --</option>
      </select>
    </div>

    <div id="brosurList" class="brosur-list"></div>

    <!-- ===================== -->
    <!-- VIEW BROSUR -->
    <!-- ===================== -->
    <button id="btnBack" onclick="kembaliKeBrosur()" style="display: none">
      ← Kembali ke Daftar Brosur
    </button>

    <iframe id="detailFrame" style="display: none"></iframe>

    <script src="app.js"></script>
  </body>
</html>
